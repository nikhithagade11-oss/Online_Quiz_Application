apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-quiz-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: online-quiz
  template:
    metadata:
      labels:
        app: online-quiz
    spec:
      containers:
        - name: online-quiz
          image: online-quiz:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: online-quiz-service
spec:
  type: NodePort
  selector:
    app: online-quiz
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30007